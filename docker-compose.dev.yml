# =============================================================================
# Sentinel DEV — Infraestructura mínima para testing local
# USO: docker compose -f docker-compose.dev.yml up -d
# RAM: ~300MB (postgres + rabbitmq), ~500MB con mongodb
# =============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentinel-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel123
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sentinel-dev-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: sentinel
      RABBITMQ_DEFAULT_PASS: sentinel123
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 15s
      timeout: 30s
      retries: 10

  # Opcional — solo si probás BFF o Results Aggregator
  mongodb:
    image: mongo:7
    container_name: sentinel-dev-mongodb
    restart: unless-stopped
    profiles: ["full"]   # solo se levanta con --profile full
    environment:
      MONGO_INITDB_ROOT_USERNAME: sentinel
      MONGO_INITDB_ROOT_PASSWORD: sentinel123
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping')", "--quiet"]
      interval: 15s
      timeout: 15s
      retries: 5
