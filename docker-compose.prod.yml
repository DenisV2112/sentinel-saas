    volumes:
      - semgrep_results:/mnt/semgrep/results
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 448M
    networks:
      - sentinel-network

  vulnerability-service:
    build:
      context: .
      dockerfile: ./Sentinel.Vulnerability.Service/Dockerfile
    container_name: sentinel-vulnerability
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=sentinel_db;User Id=${DB_USER};Password=${DB_PASSWORD};"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      VulnerabilityScan__ResultsBasePath: /mnt/vulnerability/results
    volumes:
      - vuln_results:/mnt/vulnerability/results
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 448M
    networks:
      - sentinel-network

  # ===========================================================================
  # FRONTEND
  # ===========================================================================

  sentinel-front:
    build:
      context: ./sentinel_front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${FRONTEND_API_URL}
        VITE_MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY}
    container_name: sentinel-front
    restart: always
    ports:
      - "3001:80"
    depends_on:
      kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - sentinel-network

# =============================================================================
# VOLUMES & NETWORKS
# =============================================================================

volumes:
  postgres_data:
  mongodb_data:
  rabbitmq_data:
  kong_db_data:
  n8n_data:
  semgrep_results:
  vuln_results:

networks:
  sentinel-network:
    driver: bridge
