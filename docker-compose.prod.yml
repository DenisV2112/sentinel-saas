version: '3.8'

# =============================================================================
# Sentinel SaaS — Production Docker Compose
# =============================================================================
# Based on docker-compose.local.yml (the working reference).
# Differences from local:
#   - restart: always
#   - All credentials via env vars (${VAR}), never hardcoded
#   - No exposed infra ports (Postgres, Mongo, RabbitMQ internal only)
#   - SPRING_PROFILES_ACTIVE=prod, ASPNETCORE_ENVIRONMENT=Production
#   - Real SMTP config instead of MailHog
#   - No MailHog, no Konga, no konga-db (dev tools only)
#   - Pinned image versions
#   - ddl-auto=update on first deploy (change to validate once stable)
# =============================================================================

# =============================================================================
# Logging — JSON file with rotation
# =============================================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-infra-logging: &infra-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "1"

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ===========================================================================
  # INFRASTRUCTURE
  # ===========================================================================

  postgres:
    image: postgres:15-alpine
    container_name: sentinel-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sentinel_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *infra-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - sentinel-network

  mongodb:
    image: mongo:7
    container_name: sentinel-mongodb
    restart: always
    command: ["--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: admin
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping')", "--quiet"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 20s
    logging: *infra-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - sentinel-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sentinel-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 30s
    logging: *infra-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 448M
    networks:
      - sentinel-network

  # Semgrep Runner — executes SAST scans, called by n8n
  semgrep-runner:
    build:
      context: ./semgrep-runner
      dockerfile: Dockerfile
    container_name: sentinel-semgrep-runner
    restart: always
    volumes:
      - semgrep_results:/mnt/semgrep/results
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5100/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - sentinel-network

  n8n:
    image: n8nio/n8n:latest
    container_name: sentinel-n8n
    restart: always
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - GENERIC_TIMEZONE=America/Bogota
      - NODE_OPTIONS="--max-old-space-size=256"
    volumes:
      - n8n_data:/home/node/.n8n
      - semgrep_results:/mnt/semgrep/results
      - vuln_results:/mnt/vulnerability/results
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - sentinel-network

  # ===========================================================================
  # KONG API GATEWAY
  # ===========================================================================

  kong-db:
    image: postgres:15-alpine
    container_name: sentinel-kong-db
    restart: always
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: ${KONG_DB_PASSWORD}
      POSTGRES_DB: kong
    volumes:
      - kong_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *infra-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - sentinel-network

  kong-migration:
    image: kong:3.4-alpine
    container_name: sentinel-kong-migration
    restart: on-failure
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
    depends_on:
      kong-db:
        condition: service_healthy
    logging: *infra-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - sentinel-network

  kong:
    image: kong:3.4-alpine
    container_name: sentinel-kong
    restart: always
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
    volumes:
      - ./API-Gateway/kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      kong-db:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *infra-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - sentinel-network

  # ===========================================================================
  # JAVA MICROSERVICES
  # ===========================================================================

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service-java/Dockerfile
    container_name: sentinel-auth-service
    restart: always
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseG1GC"
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_CONNECTTIMEOUT: "30000"
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_READTIMEOUT: "60000"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sentinel_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # ponytail: ddl-auto=update for first deploy, switch to validate once stable
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET}
      APP_URL: ${APP_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 448M
    networks:
      - sentinel-network

  tenant-service:
    build:
      context: .
      dockerfile: ./tenant-service/Dockerfile
    container_name: sentinel-tenant-service
    restart: always
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseG1GC"
      SPRING_PROFILES_ACTIVE: prod
