      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/sentinel_bff_cache?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      # Service discovery URLs
      SERVICES_AUTH_URL: http://auth-service:8081
      SERVICES_TENANT_URL: http://tenant-service:8082
      SERVICES_PROJECT_URL: http://project-service:8083
      SERVICES_USER_MGMT_URL: http://user-management-service:8083
      SERVICES_BILLING_URL: http://billing-service:8084
      SERVICES_ORCHESTRATOR_URL: http://scaner-orchestrator-service:8086
      SERVICES_RESULTS_AGGREGATOR_URL: http://results-aggregator-service:8087
      JavaBFF__WebhookUrl: http://backend-for-frontend-service:8080/api/bff/scans/webhook
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    logging: *default-logging
    deploy:
