  # ===========================================================================
  # .NET (C#) MICROSERVICES
  # ===========================================================================

  security-gate-service:
    build:
      context: ./Sentinel.SeurityGate.Service
      dockerfile: Dockerfile
    container_name: sentinel-security-gate
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=sentinel_db;User Id=${DB_USER};Password=${DB_PASSWORD};"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      N8n__BaseUrl: http://n8n:5678
      JavaBFF__WebhookUrl: http://backend-for-frontend-service:8080/api/bff/scans/webhook
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
