name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

env:
  DEPLOY_PATH: /home/${{ secrets.ORACLE_USER }}/sentinel-deployment

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: 🔐 Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    # === TESTS (run on GitHub x86_64 runners — unit tests, no ARM needed) ===

    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: 📦 Install Shared Java Module
      run: mvn -f sentinel-common-security/pom.xml install -DskipTests -q

    - name: 🧪 Run Java Tests
      run: |
        echo "Running tests for auth-service-java..."
        cd auth-service-java && mvn test -q && cd ..
        echo "Running tests for tenant-service..."
        cd tenant-service && mvn test -q && cd ..
        echo "Running tests for project-service..."
        cd project-service && mvn test -q && cd ..
        echo "Running tests for user-management-service..."
        cd user-management-service && mvn test -q && cd ..
        echo "Running tests for Billings..."
        cd Billings && mvn test -q && cd ..
        echo "Running tests for backend-for-frontend-service..."
        cd backend-for-frontend-service && mvn test -q && cd ..
        echo "Running tests for scaner-orchestrator-service..."
        cd scaner-orchestrator-service && mvn test -q && cd ..
        echo "Running tests for results-aggregator-service..."
        cd results-aggregator-service && mvn test -q && cd ..

    - name: 💠 Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 🧪 Run .NET Tests
      run: |
        echo "Running tests for Sentinel.SeurityGate.Service..."
        dotnet test Sentinel.SeurityGate.Service --verbosity quiet
        echo "Running tests for Sentinel.CodeQuality.Service..."
        dotnet test Sentinel.CodeQuality.Service --verbosity quiet
        echo "Running tests for Sentinel.Vulnerability.Service..."
        dotnet test Sentinel.Vulnerability.Service --verbosity quiet

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: sentinel_front/package-lock.json

    - name: 🧪 Run Frontend Tests
      run: |
        echo "Installing frontend dependencies..."
        cd sentinel_front && npm ci
        echo "Running frontend tests..."
        npm test -- --passWithNoTests
        echo "Running frontend lint..."
        npm run lint -- --max-warnings 0 || echo "⚠️ Lint warnings (non-blocking)"

    # === DEPLOY to Oracle Cloud (ARM64 Ampere A1) ===
    # Docker images are built ON the ARM64 VM — not in CI.
    # This avoids QEMU cross-compilation overhead.

    - name: 🚀 Deploy to Oracle Cloud
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} <<'EOF'
          set -e
          
          cd ${{ env.DEPLOY_PATH }}
          
          # Ensure .env.production exists
          if [ ! -f .env.production ]; then
            echo "❌ .env.production not found on VM — create it first!"
            exit 1
          fi
          
          echo "🛑 Stopping all services..."
          docker compose -f docker-compose.prod.yml --env-file .env.production down --remove-orphans 2>/dev/null || true
          
          echo "🗑️ Force removing sentinel containers..."
          docker ps -a --filter "name=sentinel" -q | xargs -r docker rm -f 2>/dev/null || true
          
          echo "🔄 Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main
          
          echo "🔨 Building Docker images (ARM64 native)..."
          docker compose -f docker-compose.prod.yml --env-file .env.production build --no-cache
          
          echo "🚀 Starting containers..."
          docker compose -f docker-compose.prod.yml --env-file .env.production up -d
          
          echo "⏳ Waiting for services to initialize..."
          sleep 30
          
          echo "🧹 Cleaning up unused images..."
          docker image prune -f
          
          echo "✅ Deployment complete!"
          docker ps --filter "name=sentinel" --format "table {{.Names}}\t{{.Status}}"
        EOF

    - name: 🔍 Health Check
      run: |
        echo "Waiting for services to stabilize..."
        sleep 30
        
        echo "Checking Frontend..."
        curl -f https://sentinel.crudzaso.com || echo "⚠️ Frontend not reachable yet (DNS may need update)"
        
        echo "Checking API via Kong..."
        curl -f https://service.sentinel.crudzaso.com/api/auth/health || echo "⚠️ API not reachable yet"

    - name: 📊 Deployment Summary
      if: always()
      run: |
        echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Target:** Oracle Cloud Ampere A1 (ARM64)" >> $GITHUB_STEP_SUMMARY
        echo "- **Frontend:** https://sentinel.crudzaso.com" >> $GITHUB_STEP_SUMMARY
        echo "- **API:** https://service.sentinel.crudzaso.com" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
